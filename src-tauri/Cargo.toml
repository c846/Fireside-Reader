[package]
name = "fireside-reader"
version = "0.1.0"
description = "A local ePub and text reader"
edition = "2021"

[lib]
name = "fireside_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
whoami = "1.5"
font-kit = "0.14"
